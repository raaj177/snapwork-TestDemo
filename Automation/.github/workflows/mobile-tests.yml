name: mobile-tests

on:
    pull_request:
        paths:
            - 'Automation/**'
    workflow_dispatch:
        inputs:
            spec:
                description: 'Spec file under src/tests (empty = regression folder)'
                required: false
                default: ''

defaults:
    run:
        working-directory: Automation

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: Automation/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm run smoke:test
            - run: npm run run-commands:test
            - run: npm run report:share:test
            - run: npm run test-data:test

    android-emulator:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            PLATFORM: android
            APP_PACKAGE: ${{ secrets.APP_PACKAGE }}
            APP_ACTIVITY: ${{ secrets.APP_ACTIVITY }}
            APP_PATH: ${{ secrets.APP_PATH }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - run: npm ci
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  working-directory: Automation
                  script: npm run test:android -- ${{ github.event.inputs.spec && format('--spec "{0}"', github.event.inputs.spec) || '' }}
            - if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mobile-results
                  path: |
                      Automation/allure-results
                      Automation/test-results
                      Automation/logs
