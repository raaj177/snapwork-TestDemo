interface:
  display_name: "QA Automation Orchestrator"
  short_description: "Run automation setup, test case generation, review and testcase implementation in sequence for any project"
  default_prompt: "Use $qa-automation-orchestrator to run the QA pipeline in phases, one after another, for the project defined by .github/_requirements/ (user stories in user_stories/; documents only): Phase 0 prepare folders and check the user stories, Phase 1 $automation-setup (ask platform: Mobile, Web or Mobile + Web; check Automation/; build the framework structure without the app - Mobile flat in Automation/, Web in Automation/Web/, Mobile + Web in Automation/Mobile/ and Automation/Web/ - skip if the framework(s) already exist), Phase 2 $test-cases-generator (workbook to reports/), Phase 3 $test-cases-reviewer (mandatory review of that workbook), Phase 4 (mobile only; Automation/ below is Automation/Mobile/ for Mobile + Web, and Web stops after Phase 3) take the app build from Automation/apps/<platform>/ (or ask for its path), read its values into Automation/.env, then $implement-testcases-v2 on the reviewed workbook copied to Automation/testcase/Testcases/. Start each phase only after the previous one completes, pass its output forward, and keep the state in orchestration/pipeline-state.json."
