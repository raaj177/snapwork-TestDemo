interface:
  display_name: "Smoke Bugs to Jira"
  short_description: "Triage smoke failures by evidence and file verified, de-duplicated Jira bugs under the smoke epic"
  default_prompt: "Use $smoke-bugs-to-jira for this project: confirm the application, platform, approved workbook, Jira site and project (default from .github/_requirements/user_stories/jira-source.md), epic name '<Application> Smoke bugs automation', assignee and any existing epic key; inspect the framework, smoke manifest, run record and screenshots; apply only evidence-backed reliability fixes; run the smallest safe failed-test set after approval; triage by root cause; then with scripts/jira_bugs.py check access, reuse or create the epic, search before each create, create one bug per product discrepancy with parent, assignee and a reviewed screenshot, verify and record each issue in <AutomationDir>/Jira/issues.json, update Jira/README.md, and report counts, links and blockers. Never ask for a token in chat."
