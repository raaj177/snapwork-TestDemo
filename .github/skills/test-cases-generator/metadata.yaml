      - "Added Testcase behaviour separation based on ios and android platform if it behaves differently on both cases like back button in android and gesture in ios to move back to previous screen"
      - "Added Testcase types column for 3 modes other than greenfield with new/invalidated/modified/existing"

  - version: "1.3.8"
    changes:
      - "Updated the skill as per the playbook format"
      - "added input to detect the platform automatically mobile app or web/pwa"
