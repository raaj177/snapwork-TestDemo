      - "Added inputs to brownfield to have ADR, constitution, Document scope, context history"

  - version: "1.3.7"
    date: "2026-09-12"
    changes:
      - "Added mandatory iOS Dashboard sheet to every generated workbook."
      - "iOS Dashboard mirrors the manual Dashboard: Overall, User Story/Module-wise, Test Category-wise, Priority-wise, execution status buckets, and Pass %."
      - "Every iOS Dashboard formula dynamically counts only testcase rows where IOS Testcase = Yes; execution buckets use the normal manual Status column."
      - "Added structural verification that iOS Dashboard exists and contains IOS Testcase = Yes COUNTIF/COUNTIFS filtering."
      - "Added dashboard reconciliation for iOS Dashboard in build.py."
      - "Documented identical behavior for Claude Projects, ChatGPT, Codex, Cursor, Cloud Agents, and similar runtimes."

  - version: "1.3.6"
    date: "2026-09-12"
    changes:
      - "Added mandatory requirement-to-testcase normalization for technical/system-style BRD and User Story statements."
      - "Test descriptions should use clear user-observable/business language while preserving every behavior-driving condition."
      - "Internal flags/states may be moved to Pre-condition or Test Data when that makes the testcase clearer, with original Requirement Reference retained."
      - "Added explicit example for valid credentials + cleared first-login condition routing to Dashboard."
      - "Clarified that normalization must not weaken, reinterpret, or invent requirements."
      - "Rule is runtime-neutral and explicitly supports Claude Projects as well as ChatGPT, Codex, Cursor, Cloud Agents, and similar tools."

  - version: "1.3.5"
    date: "2026-09-11"
    changes:
      - "Added Greenfield/Brownfield project-aware generation. Greenfield generates complete approved-scope coverage; Brownfield reviews existing project artifacts first and generates delta-only coverage."
      - "Added Claude Projects compatibility: Project Context/project knowledge is reviewed for matching Story IDs, modules/features, and semantically equivalent requirements before new testcase generation. Equivalent behavior applies to accessible Codex, ChatGPT, Cursor, Cloud Agent, or similar project context."
      - "Brownfield semantic delta now prevents repeated testcase rows for UNCHANGED / NO_MEANINGFUL_CHANGE requirements; testcase generation is limited to ADDED, MODIFIED, and IMPACTED behavior, with removed requirements treated as RETIRE_CANDIDATE."
      - "Added mandatory IOS Testcase Yes/No column. Yes marks a focused important-scenario subset for iOS execution; it does not duplicate the entire suite and is independent of automation/regression classification."
      - "Added iOS-specific coverage guidance for biometrics, permissions, keyboard/input, app lifecycle, WebView/Safari/SDK transitions, deep links, notifications, native file/photo/camera pickers, navigation/dismissal, secure storage/session, and supported iOS/device compatibility when applicable."
      - "Added validator enforcement for explicit IOS Testcase classification and a warning against blanket all-Yes iOS selection."

  - version: "1.3.4"
    date: "2026-09-10"
    changes:
      - "Added one consolidated Test Data Requirements worksheet to every generated testcase workbook."
      - "Added compact columns: Test Data ID, Test Data Description, Required For, Status."
      - "Added controlled Test Data Status values: Not Prepared, Requested, In Progress, Available, Blocked."
      - "Added top-level test_data_requirements to cases.json; requirements must be semantically unique across the workbook and must not contain actual credentials, PII, account numbers, passwords, or secrets."
      - "Added governance validation for missing/duplicate test-data IDs, duplicate descriptions, and invalid Test Data Status values."
      - "Updated workbook structural verification to require the new sheet."

  - version: "1.3.3"
    date: "2026-09-10"
    changes:
      - "Removed Generic Cross-Cutting testcase generation from the Test Excel output."
      - "Removed the mandatory shared 8-case cross-cutting set and the dedicated worksheet requirement."
      - "Added preflight rejection (GV005) if a Generic Cross-Cutting module/sheet is supplied."
      - "Source-explicit cross-cutting behavior remains allowed only inside the relevant story/module with normal traceability."
      - "Accessibility testcase exclusion remains unchanged."
      - "All other workbook structure, dashboards, fields, scoring, traceability, automation, regression, and governance behavior remains unchanged."

  - version: "1.3.2"
    title: "Accessibility testcase exclusion"
    changes:
      - "Removed Accessibility from the governed Excel Test Category enum and dropdown values."
      - "Removed accessibility/a11y/WCAG/assistive-navigation scenarios from generated testcase scope."
      - "Replaced the accessibility-oriented Generic Cross-Cutting case with generic unexpected-error recovery so the shared set remains eight cases."
      - "Added an explicit generation rule: accessibility-only requirements are excluded from testcase coverage denominators and no accessibility cases are written to the workbook."
      - "All other workbook structure, governance, scoring, traceability, validation, automation fields, and output behavior remain unchanged."

  - version: "1.3.1"
    title: "Traceability & Governance Hardening"
    changes:
      - "Added scripts/validate_cases.py hard preflight before workbook creation."
      - "Scenario IDs and Test Case IDs are mandatory and unique."
      - "SOURCE/DERIVED/BLOCKED cases require Requirement Reference."
      - "BLOCKED cases require TBD expected result plus RQ-... in Remarks."
      - "Config enum validation now rejects values such as Not Started; design-stage default is Not Executed."
      - "Generic Cross-Cutting defaults to ADVISORY unless explicit source evidence exists."
      - "Regression Candidate must be explicitly Yes/No; blanket all-Yes classification is detected."
      - "build.py aborts before creating Excel when preflight governance fails."
      - "Removed silent defaults of SOURCE and Regression=Yes from the workbook renderer."

  - version: "1.3.0"
    title: "Token-optimised restructure (same output)"
    description: "Output contract unchanged: one governed workbook (Dashboard, Automation Dashboard, Config, one sheet per story, Generic Cross-Cutting), 21 columns, Config-backed dropdowns, live COUNTIF/COUNTIFS dashboards, Automation Remark final. scripts/common.py is byte-identical to v1.2.3."
    changes:
      - "SKILL.md rewritten (6.2K → ~2.6K tokens); conditional loading table tells the model which reference to open, and only that one."
      - "references/rules.md merges constitution-rules, copilot-enforcement, coverage-checklist, scoring-rubric (11.5K → 3.4K) with duplicates removed (status lists, COPILOT, hard-fails were each stated 3–4 times)."
      - "references/prompts-library.md condensed to non-Generate modes; COPILOT contracts as one table."
      - "references/story-history.md (registry + QA-DELTA-001) loaded only when a Story ID hits the registry."
      - "references/workbook-contract.md loaded only on demand — build.py enforces it anyway."
      - "scripts/build.py: one command = build + structural verify + LibreOffice recalc error scan + dashboard reconciliation + coverage/duplicate/vague check. Replaces 3–4 separate tool calls; the model never opens common.py."
      - "scripts/extract_source.py: tracked-change-aware DOCX/PDF/text extraction printed once (replaces prose instructions to inspect document.xml)."
      - "scripts/check_coverage.py: reads cases.json directly (no CSV round-trip); same heuristics."
      - "assets/cases.example.json replaces example_data.py and the 43-column test_case_template.csv, which conflicted with the 21-column workbook and caused a second Excel/CSV artifact."
      - "Cases are written once (cases.json) — no chat echo of Gate 2/4, no per-story files, no side CSV."
      - "Removed RELEASE_NOTES.md from the package (it was being pulled into context)."
